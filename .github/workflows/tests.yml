# Runs the three test suites.
#
# First passed on 2026-10-10, on macOS 26.6.2 with Xcode 26.6 (Swift 6.3.3),
# exiftool 13.55 and dnglab 0.8.0: 844 tests in the root package with 61
# skipped, 66 in the server package with 21 skipped, 73 for the window. The
# maintainer's Mac has Swift 6.4, and the runner's older compiler refused one
# pattern that 6.4 accepts (docs/decisions.md, 2026-10-10). So a green run on
# a Mac does not prove a green run here. What to know about this workflow:
#
#   1. The runner image. Read the output of the "Versions" step. The package
#      has the tools version 5.9. The app sets SWIFT_VERSION 6.0 in
#      project.yml, so the Xcode of the image must have a Swift 6 compiler.
#      If the default Xcode cannot build, pin `runs-on` to an image that can,
#      or select another Xcode with `sudo xcode-select -s`.
#   2. Homebrew. `brew install` must find exiftool, dnglab and xcodegen. The
#      tests were run with exiftool 13.55, dnglab 0.8.0 and XcodeGen 2.44.1.
#   3. What skips. The repo has no fixtures/, because the photo is private,
#      and the image has no Adobe DNG Converter. So every test on the real
#      programs skips, and so do the end-to-end tests that run on a photo.
#      A green run here proves the unit tests, the tests that start the
#      built tool and the built server with no photo, and the checks of the
#      documents. It does not prove the conversion or the drift check. Read
#      the "Skipped tests" step.
#   4. The tests that make disk images with hdiutil. They skip when the
#      runner cannot make or attach an image.
#   5. The tests with real signals and real pipes: InterruptTests, and the
#      end-to-end tests of the server. They depend on timing, and a shared
#      runner is slower than a Mac. They passed on the first green run.
#   6. The window's tests. The targets are signed to run locally
#      (CODE_SIGN_IDENTITY "-"). See that xcodebuild can sign on the runner.
#   7. This workflow runs on every push and on every pull request. A push to
#      the branch of an open pull request starts it twice. Narrow `push` to
#      the main branch if that is too much.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install exiftool, dnglab and XcodeGen
        run: |
          brew install exiftool dnglab xcodegen
          exiftool -ver
          dnglab --version
          xcodegen --version

      - name: The root package
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Skipped tests
        run: grep -i "skipped" swift-test.log || echo "No test skipped."

      - name: The server package
        run: swift test --package-path MCPServer

      - name: The window
        run: |
          xcodegen generate
          xcodebuild -project PlateworksDesqueeze.xcodeproj -scheme PlateworksDesqueeze -derivedDataPath build test
